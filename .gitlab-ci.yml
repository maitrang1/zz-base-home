# GitLab CI: Linux only, no secrets. macOS + Windows + attest + release stay on GitHub.
# The image already holds git, curl, tar, xz, bzip2 and unzip, so no apt download can fail or drift.
image: buildpack-deps:noble@sha256:890e8b5c0040e1deff5cc7dc7b4414e67069f79e3301afc4ec5bd49d64ef13e5

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "ci-test"
    - if: $CI_COMMIT_TAG

default:
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure]

boot:
  stage: test
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  script:
    - sh mo-modu/mo-core/bs-boot-modu/sh-boot-stra.sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise exec -- gitleaks git --redact --no-banner

build2:
  stage: test
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "ci-test"
  script:
    - sh mo-modu/mo-core/bs-boot-modu/sh-boot-stra.sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise exec -- zig build dist --build-file as-apps/os-syst/wo-work-mode/build.zig --prefix /tmp/out1 --cache-dir /tmp/zc1 --global-cache-dir /tmp/zg1
    - mise exec -- zig build dist --build-file as-apps/os-syst/wo-work-mode/build.zig --prefix /tmp/out2 --cache-dir /tmp/zc2 --global-cache-dir /tmp/zg2
    - (cd /tmp/out1/dist && find . -type f -exec sha256sum {} + | sort -k2) > /tmp/h1.txt
    - (cd /tmp/out2/dist && find . -type f -exec sha256sum {} + | sort -k2) > /tmp/h2.txt
    - diff /tmp/h1.txt /tmp/h2.txt
    - mkdir -p out && cp /tmp/h1.txt out/sha256.txt && cat out/sha256.txt
  artifacts:
    paths:
      - out/sha256.txt
    expire_in: 1 year
