name: ci-drif-flow
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions: {}
cache-mode: read
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap
        run: sh mo-modu/mo-core/bs-boot-modu/sh-boot-stra.sh
      - name: mise on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: lock has no drift
        run: mise lock && git diff --exit-code mise.lock
