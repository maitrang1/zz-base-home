name: ci-rele-flow
on:
  push:
    tags: ['v*']
permissions: {}
cache-mode: none
jobs:
  build:
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap
        run: sh mo-modu/mo-core/bs-boot-modu/sh-boot-stra.sh
      - name: mise on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build 1 (own cache dirs, no cache)
        run: mise exec -- zig build dist --build-file as-apps/os-syst/wo-work-mode/build.zig --prefix "$RUNNER_TEMP/out1" --cache-dir "$RUNNER_TEMP/zc1" --global-cache-dir "$RUNNER_TEMP/zg1"
      - name: build 2 (fresh cache dirs, no cache)
        run: mise exec -- zig build dist --build-file as-apps/os-syst/wo-work-mode/build.zig --prefix "$RUNNER_TEMP/out2" --cache-dir "$RUNNER_TEMP/zc2" --global-cache-dir "$RUNNER_TEMP/zg2"
      - name: both builds are byte-identical
        run: |
          (cd "$RUNNER_TEMP/out1/dist" && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/h1.txt"
          (cd "$RUNNER_TEMP/out2/dist" && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/h2.txt"
          diff "$RUNNER_TEMP/h1.txt" "$RUNNER_TEMP/h2.txt"
      - name: digests
        run: |
          mkdir -p dist
          cp -R "$RUNNER_TEMP/out1/dist/." dist/
          (cd dist && find . -type f ! -name sha256.txt -exec sha256sum {} + > sha256.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
  attest:
    needs: build
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
