name: ci-rele-flow
on:
    push:
        tags: ['v*']
permissions: {}
cache-mode: none
jobs:
    build:
        runs-on: ubuntu-latest
        cache-mode: none
        permissions:
            contents: read
        steps:
            - uses: step-security/harden-runner@v2.23.0
              with:
                  egress-policy: audit
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: bootstrap
              run: sh mo-modu/mo-core/bs-boot-modu/sh-boot-stra.sh
            - name: mise on PATH
              run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: build 1 (own cache dirs, no cache)
              run: mise exec -- zig build dist --build-file as-apps/os-syst/wo-work-mode/build.zig --prefix "$RUNNER_TEMP/out1" --cache-dir "$RUNNER_TEMP/zc1" --global-cache-dir "$RUNNER_TEMP/zg1"
            - name: build 2 (fresh cache dirs, no cache)
              run: mise exec -- zig build dist --build-file as-apps/os-syst/wo-work-mode/build.zig --prefix "$RUNNER_TEMP/out2" --cache-dir "$RUNNER_TEMP/zc2" --global-cache-dir "$RUNNER_TEMP/zg2"
            - name: both builds are byte-identical
              run: |
                  (cd "$RUNNER_TEMP/out1/dist" && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/h1.txt"
                  (cd "$RUNNER_TEMP/out2/dist" && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/h2.txt"
                  diff "$RUNNER_TEMP/h1.txt" "$RUNNER_TEMP/h2.txt"
            - name: digests
              run: |
                  mkdir -p dist
                  cp -R "$RUNNER_TEMP/out1/dist/." dist/
                  (cd dist && find . -type f ! -name sha256.txt -exec sha256sum {} + > sha256.txt)
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: dist
                  path: dist
    attest:
        needs: build
        runs-on: ubuntu-latest
        cache-mode: none
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/download-artifact@v8.0.2
              with:
                  name: dist
                  path: dist
            - uses: actions/attest-build-provenance@v4.2.2
              with:
                  subject-path: dist/**
    publish:
        needs: [build, attest]
        runs-on: ubuntu-latest
        cache-mode: none
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8.0.2
              with:
                  name: dist
                  path: dist
            - name: pending prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p rel
                  for dir in dist/*/; do
                      name=$(basename "$dir")
                      tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C "$dir" . | gzip -n > "rel/wo-$name.tar.gz"
                  done
                  cp dist/sha256.txt rel/sha256.txt
                  gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --prerelease --notes "⏳ Pending: the GitLab cross-build check has not finished. Do not use these files until this line says Verified." rel/*
    verify:
        needs: publish
        runs-on: ubuntu-latest
        cache-mode: none
        permissions:
            contents: write
        steps:
            - uses: step-security/harden-runner@v2.23.0
              with:
                  egress-policy: audit
            - uses: actions/download-artifact@v8.0.2
              with:
                  name: dist
                  path: dist
            - name: GitLab built the same bytes, then mark the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  url="https://gitlab.com/api/v4/projects/dinhthimaitrang1%2Fzz-base-home/jobs/artifacts/${GITHUB_REF_NAME}/raw/out/sha256.txt?job=build2"
                  code=000
                  for i in $(seq 1 50); do
                      code=$(curl -s -o gl.txt -w '%{http_code}' "$url") || true
                      [ "$code" = 200 ] && break
                      sleep 30
                  done
                  [ "$code" = 200 ] || { echo "GitLab sha256.txt not found for $GITHUB_REF_NAME (last http $code): the release stays pending, re-run this job later"; exit 1; }
                  norm() { sed 's/ \*/ /; s/  / /' "$1" | awk '{print $1, $2}' | sort -k2; }
                  norm dist/sha256.txt > gh.n
                  norm gl.txt > gl.n
                  body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
                  if ! diff gh.n gl.n; then
                      gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$(printf '%s' "$body" | sed 's/^.*Pending: the GitLab cross-build.*$/❌ HASH MISMATCH between the GitHub and GitLab builds. Do not use these files./')"
                      exit 1
                  fi
                  gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$(printf '%s' "$body" | sed "s/^.*Pending: the GitLab cross-build.*\$/✅ Verified: GitHub and GitLab built identical bytes ($(wc -l < gh.n) binaries)./")"
                  case "$GITHUB_REF_NAME" in
                      *-*) ;;
                      *) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest ;;
                  esac
