name: ci-main-flow
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
cache-mode: read
jobs:
  boot:
    name: boot-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bootstrap
        if: runner.os != 'Windows'
        run: sh mo-modu/mo-core/bs-boot-modu/sh-boot-stra.sh
      - name: bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./mo-modu/mo-core/bs-boot-modu/ps-boot-stra.ps1
